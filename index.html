<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wortweg — 以 Goldlist 蒸馏法为核心的德语 B2 词汇工具" />
    <meta name="theme-color" content="#09090b" />
    <meta name="application-name" content="Wortweg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wortweg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Wortweg · 德语词汇蒸馏</title>
    <script>
      // 防闪烁：从持久化数据里读取主题偏好（默认深色）
      try {
        var s = JSON.parse(localStorage.getItem('wortweg-storage') || 'null')
        var light = s && s.state && s.state.settings && s.state.settings.theme === 'light'
        if (light) document.documentElement.classList.remove('dark')
        var theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute('content', light ? '#f4f4f5' : '#09090b')
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
        if (bar) bar.setAttribute('content', light ? 'default' : 'black')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
